---
- name: Verify Hermes Minimal runtime
  hosts: hermes
  become: true
  gather_facts: false
  vars:
    hermes_data_dir: /opt/hermes/data
    hermes_runtime_owner: "10000"
    hermes_runtime_group: "10000"
    hermes_runtime_home: /opt/data
    hermes_codex_home: /opt/data/.codex
    hermes_cli_argv_prefix:
      - docker
      - exec
      - --user
      - "{{ hermes_runtime_owner }}:{{ hermes_runtime_group }}"
      - --env
      - "HOME={{ hermes_runtime_home }}"
      - --env
      - "CODEX_HOME={{ hermes_codex_home }}"
      - hermes
      - hermes
    hermes_profile_source_dir: "{{ playbook_dir }}/../profiles"
    hermes_profile_names:
      - manager
      - devops
      - coding
      - research
  tasks:
    - name: Read container health
      ansible.builtin.command:
        argv:
          - docker
          - inspect
          - --format
          - "{{ '{{' }}.State.Health.Status{{ '}}' }}"
          - hermes
      register: runtime_health
      changed_when: false
      failed_when: runtime_health.stdout != "healthy"

    - name: Verify configured profiles through Hermes CLI
      ansible.builtin.command:
        argv: "{{ hermes_cli_argv_prefix + ['profile', 'show', item] }}"
      loop:
        - manager
        - devops
        - coding
        - research
      changed_when: false

    - name: Verify preserved or explicitly replaced profile identities
      ansible.builtin.include_tasks: tasks/verify_profile_identities.yml

    - name: Verify model configuration is complete
      ansible.builtin.command:
        argv: "{{ hermes_cli_argv_prefix + ['--profile', 'manager', 'config', 'check'] }}"
      changed_when: false

    - name: Prove one profile reaches its configured model
      ansible.builtin.command:
        argv: >-
          {{ hermes_cli_argv_prefix + ['--profile', 'manager', '-z',
          'Reply with one short sentence confirming that the inference path is working.'] }}
      register: runtime_inference_probe
      changed_when: false
      failed_when: >-
        runtime_inference_probe.rc != 0 or
        runtime_inference_probe.stdout | trim | length == 0

- name: Verify optional Telegram gateway state
  ansible.builtin.import_playbook: telegram_verify.yml
  when: hermes_telegram_state | default("") == "enabled"
