---
- name: Synchronize provider credentials into every profile
  ansible.builtin.copy:
    src: "{{ hermes_env_source }}"
    dest: "{{ hermes_data_dir }}/profiles/{{ item }}/.env"
    owner: "{{ hermes_runtime_owner }}"
    group: "{{ hermes_runtime_group }}"
    mode: "0600"
  loop: "{{ hermes_profile_names }}"
  when: hermes_model_provider != "openai-codex"
  no_log: true
  notify: Restart Hermes
