---
- name: Install baseline security packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - fail2ban
      - python3-debian
      - unattended-upgrades
      - ufw
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Disable SSH password authentication
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/60-hermes-hardening.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin prohibit-password
      X11Forwarding no
      MaxAuthTries 4
  notify: Validate and restart ssh

- name: Flush validated SSH configuration before root credential changes
  ansible.builtin.meta: flush_handlers

- name: Validate SSH before enforcing root credentials
  ansible.builtin.command: sshd -t
  changed_when: false

- name: Enforce the root credential lifecycle
  ansible.builtin.import_tasks: root_credentials.yml

- name: Create Hermes host-state directory
  ansible.builtin.file:
    path: /etc/hermes
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Inspect previously managed SSH source CIDRs
  ansible.builtin.stat:
    path: /etc/hermes/ssh-source-cidrs
  register: base_managed_ssh_cidrs_file

- name: Read previously managed SSH source CIDRs
  ansible.builtin.slurp:
    path: /etc/hermes/ssh-source-cidrs
  register: base_managed_ssh_cidrs_raw
  when: base_managed_ssh_cidrs_file.stat.exists

- name: Parse previously managed SSH source CIDRs
  ansible.builtin.set_fact:
    base_previous_ssh_source_cidrs: >-
      {{
        (base_managed_ssh_cidrs_raw.content | b64decode).splitlines()
        if base_managed_ssh_cidrs_file.stat.exists
        else []
      }}

- name: Allow SSH from explicit administrative CIDRs
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
    from_ip: "{{ item }}"
    comment: hermes-managed-ssh
  loop: "{{ hermes_ssh_source_cidrs }}"

- name: Remove stale Hermes-managed SSH source CIDRs
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
    from_ip: "{{ item }}"
    delete: true
  loop: "{{ base_previous_ssh_source_cidrs | difference(hermes_ssh_source_cidrs) }}"

- name: Persist the managed SSH source CIDR set
  ansible.builtin.copy:
    dest: /etc/hermes/ssh-source-cidrs
    owner: root
    group: root
    mode: "0600"
    content: "{{ hermes_ssh_source_cidrs | join('\n') }}\n"

- name: Set UFW incoming policy
  community.general.ufw:
    direction: incoming
    policy: deny

- name: Set UFW outgoing policy
  community.general.ufw:
    direction: outgoing
    policy: allow

- name: Enable UFW
  community.general.ufw:
    state: enabled

- name: Enable security services
  ansible.builtin.service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - fail2ban
    - unattended-upgrades
