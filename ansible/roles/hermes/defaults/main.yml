---
hermes_app_dir: /opt/hermes/app
hermes_data_dir: /opt/hermes/data
hermes_container_name: hermes
hermes_app_owner: root
hermes_app_group: root
hermes_runtime_owner: "10000"
hermes_runtime_group: "10000"
hermes_runtime_home: /opt/data
hermes_codex_home: /opt/data/.codex
hermes_auth_store_path: "{{ hermes_data_dir }}/auth.json"
hermes_cli_argv_prefix:
  - docker
  - exec
  - --user
  - "{{ hermes_runtime_owner }}:{{ hermes_runtime_group }}"
  - --env
  - "HOME={{ hermes_runtime_home }}"
  - --env
  - "CODEX_HOME={{ hermes_codex_home }}"
  - "{{ hermes_container_name }}"
  - hermes
hermes_model_tty_command: >-
  docker exec --interactive --tty
  --user {{ hermes_runtime_owner }}:{{ hermes_runtime_group }}
  --env HOME={{ hermes_runtime_home }}
  --env CODEX_HOME={{ hermes_codex_home }}
  {{ hermes_container_name }} hermes model
hermes_restart_enabled: true
hermes_env_source: ""
hermes_codex_auth_source: ""
hermes_profiles:
  - name: manager
    description: Coordinates outcomes, work state, and verification.
  - name: devops
    description: Operates infrastructure with guarded changes and runtime proof.
  - name: coding
    description: Implements maintainable code through tested vertical slices.
  - name: research
    description: Researches current primary sources and separates evidence from inference.
hermes_profile_names: "{{ ['default'] + (hermes_profiles | map(attribute='name') | list) }}"
hermes_desired_profile_config:
  - key: model.provider
    value: "{{ hermes_model_provider }}"
  - key: model.default
    value: "{{ hermes_model }}"
  - key: stt.language
    value: ru
  - key: tool_loop_guardrails.hard_stop_enabled
    value: "true"
