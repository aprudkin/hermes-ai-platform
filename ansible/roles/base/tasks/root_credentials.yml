---
- name: Read the intended root SSH public key on the controller
  ansible.builtin.set_fact:
    base_root_ssh_public_key_lines: >-
      {{
        lookup('ansible.builtin.file', hermes_root_ssh_public_key_source).splitlines()
        | map('trim')
        | reject('equalto', '')
        | reject('match', '^#')
        | list
      }}
  no_log: true

- name: Parse the intended root SSH public key
  ansible.builtin.set_fact:
    base_root_ssh_public_key_fields: "{{ base_root_ssh_public_key_lines[0].split() }}"
  when: base_root_ssh_public_key_lines | length == 1
  no_log: true

- name: Validate one supported root SSH public key
  ansible.builtin.assert:
    that:
      - base_root_ssh_public_key_lines | length == 1
      - base_root_ssh_public_key_fields | default([]) | length >= 2
      - >-
        base_root_ssh_public_key_fields[0] in
        ['ssh-ed25519', 'ssh-rsa', 'ecdsa-sha2-nistp256',
         'ecdsa-sha2-nistp384', 'ecdsa-sha2-nistp521']
      - base_root_ssh_public_key_fields[1] is match('^[A-Za-z0-9+/=]+$')
    fail_msg: The root credential source must contain exactly one supported OpenSSH public key.
  no_log: true

- name: Protect the root SSH directory
  ansible.builtin.file:
    path: "{{ base_root_home }}/.ssh"
    state: directory
    owner: "{{ base_root_owner }}"
    group: "{{ base_root_group }}"
    mode: "0700"

- name: Inspect the current root SSH authorization
  ansible.builtin.stat:
    path: "{{ base_root_authorized_keys_path }}"
  register: base_root_authorized_keys

- name: Inspect the preserved pre-hardening authorization
  ansible.builtin.stat:
    path: "{{ base_root_authorized_keys_backup_path }}"
  register: base_root_authorized_keys_backup

- name: Preserve the pre-hardening root SSH authorization once
  ansible.builtin.copy:
    src: "{{ base_root_authorized_keys_path }}"
    dest: "{{ base_root_authorized_keys_backup_path }}"
    remote_src: true
    force: false
    owner: "{{ base_root_owner }}"
    group: "{{ base_root_group }}"
    mode: "0600"
  when:
    - base_root_authorized_keys.stat.exists
    - not base_root_authorized_keys_backup.stat.exists
  no_log: true

- name: Restrict the intended root SSH authorization
  ansible.builtin.copy:
    dest: "{{ base_root_authorized_keys_path }}"
    owner: "{{ base_root_owner }}"
    group: "{{ base_root_group }}"
    mode: "0600"
    content: >
      restrict {{ base_root_ssh_public_key_fields[0] }}
      {{ base_root_ssh_public_key_fields[1] }}
  no_log: true

- name: Lock the root password credential
  ansible.builtin.user:
    name: root
    password_lock: true
  when: base_root_password_lock_enabled | bool
