---
- name: Exercise protected Codex subscription credential installation
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  vars:
    hermes_model_provider: openai-codex
    hermes_data_dir: "{{ lookup('ansible.builtin.env', 'HERMES_TEST_DATA_DIR') }}"
    hermes_codex_auth_source: "{{ lookup('ansible.builtin.env', 'HERMES_TEST_CODEX_AUTH') }}"
    hermes_runtime_owner: "{{ lookup('ansible.builtin.env', 'HERMES_TEST_OWNER') }}"
    hermes_runtime_group: "{{ lookup('ansible.builtin.env', 'HERMES_TEST_GROUP') }}"
    hermes_auth_store_path: "{{ lookup('ansible.builtin.env', 'HERMES_TEST_HERMES_AUTH') }}"
    hermes_restart_enabled: false
  tasks:
    - name: Run the production credential installation task
      ansible.builtin.include_role:
        name: hermes
        tasks_from: install_credentials

    - name: Bootstrap the production Hermes auth store
      ansible.builtin.include_role:
        name: hermes
        tasks_from: bootstrap_codex_auth

    - name: Prove runtime credential installation is idempotent
      ansible.builtin.include_role:
        name: hermes
        tasks_from: install_credentials

    - name: Prove Hermes auth bootstrap is idempotent
      ansible.builtin.include_role:
        name: hermes
        tasks_from: bootstrap_codex_auth
