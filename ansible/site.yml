---
- name: Configure Hermes Minimal host
  hosts: hermes
  become: true
  gather_facts: false

  pre_tasks:
    - name: Wait for the authorized target to become reachable
      ansible.builtin.wait_for_connection:
        timeout: 300
        sleep: 5

    - name: Gather target facts after connection is ready
      ansible.builtin.setup:

    - name: Validate supported target and required local inputs
      ansible.builtin.assert:
        that:
          - ansible_distribution == "Ubuntu"
          - ansible_distribution_version is version("24.04", ">=")
          - hermes_env_source | default("") | length > 0
          - hermes_model_provider | default("") | length > 0
          - hermes_model | default("") | length > 0
          - hermes_ssh_source_cidrs | default([]) | length > 0
        fail_msg: >-
          Minimal supports Ubuntu 24.04+ and requires hermes_env_source to point
          to a controller-local populated Hermes .env file plus explicit
          model values and administrative SSH source CIDRs.

  roles:
    - role: base
    - role: docker
    - role: hermes
