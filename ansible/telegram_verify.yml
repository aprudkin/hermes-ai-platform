---
- name: Verify targeted Hermes Telegram gateway state
  hosts: hermes
  become: true
  gather_facts: false
  vars:
    hermes_app_dir: /opt/hermes/app
    hermes_data_dir: /opt/hermes/data
    hermes_container_name: hermes
    hermes_app_owner: root
    hermes_app_group: root
    hermes_runtime_owner: "10000"
    hermes_runtime_group: "10000"
    hermes_runtime_home: /opt/data
    hermes_codex_home: /opt/data/.codex
    hermes_gateway_runtime_env_path: "{{ hermes_app_dir }}/gateway.env"
    hermes_gateway_profile_backup_path: "{{ hermes_app_dir }}/gateway-profile.pre-telegram"
    hermes_gateway_managed_profile_path: "{{ hermes_app_dir }}/gateway-profile.telegram-managed"
    hermes_profile_names:
      - default
      - manager
      - devops
      - coding
      - research
    hermes_telegram_expected_keys:
      - TELEGRAM_BOT_TOKEN
      - TELEGRAM_ALLOWED_USERS
      - TELEGRAM_ALLOWED_CHATS
      - TELEGRAM_REQUIRE_MENTION
      - TELEGRAM_EXCLUSIVE_BOT_MENTIONS
      - TELEGRAM_OBSERVE_UNMENTIONED_GROUP_MESSAGES
    hermes_cli_argv_prefix:
      - docker
      - exec
      - --user
      - "{{ hermes_runtime_owner }}:{{ hermes_runtime_group }}"
      - --env
      - "HOME={{ hermes_runtime_home }}"
      - --env
      - "CODEX_HOME={{ hermes_codex_home }}"
      - "{{ hermes_container_name }}"
      - hermes

  tasks:
    - name: Validate the value-free Telegram verification request
      ansible.builtin.assert:
        that:
          - hermes_telegram_state in ["enabled", "disabled"]
          - >-
            (hermes_telegram_state == "enabled" and
             hermes_gateway_profile | default("") | length > 0) or
            (hermes_telegram_state == "disabled" and
             hermes_gateway_profile | default("") | length == 0)
        fail_msg: Telegram verification request is invalid.
        success_msg: Telegram verification request is valid.
      changed_when: false
      no_log: true

    - name: Inspect protected Telegram runtime and retained state files
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop:
        - "{{ hermes_gateway_runtime_env_path }}"
        - "{{ hermes_gateway_profile_backup_path }}"
        - "{{ hermes_gateway_managed_profile_path }}"
      register: hermes_telegram_verify_state_stats
      changed_when: false
      no_log: true

    - name: Validate protected Telegram runtime and retained state metadata
      ansible.builtin.assert:
        that:
          - item.stat.isreg
          - not item.stat.islnk
          - item.stat.mode == "0600"
          - item.stat.pw_name == hermes_app_owner
          - item.stat.gr_name == hermes_app_group
        fail_msg: Protected Telegram runtime or retained state metadata is invalid.
        success_msg: Protected Telegram state metadata is valid.
      loop: "{{ hermes_telegram_verify_state_stats.results }}"
      changed_when: false
      no_log: true

    - name: Read protected Telegram runtime and retained state
      ansible.builtin.slurp:
        src: "{{ item.item }}"
      loop: "{{ hermes_telegram_verify_state_stats.results }}"
      register: hermes_telegram_verify_state_contents
      changed_when: false
      no_log: true

    - name: Decode protected Telegram runtime and retained state
      ansible.builtin.set_fact:
        hermes_verified_runtime_profile_raw: >-
          {{ hermes_telegram_verify_state_contents.results[0].content | b64decode }}
        hermes_verified_backup_profile_raw: >-
          {{ hermes_telegram_verify_state_contents.results[1].content | b64decode }}
        hermes_verified_managed_profile_raw: >-
          {{ hermes_telegram_verify_state_contents.results[2].content | b64decode }}
      no_log: true

    - name: Validate protected Telegram retained profile structure
      ansible.builtin.assert:
        that:
          - hermes_verified_backup_profile_raw.endswith('\n')
          - hermes_verified_backup_profile_raw.count('\n') == 1
          - hermes_verified_managed_profile_raw.endswith('\n')
          - hermes_verified_managed_profile_raw.count('\n') == 1
          - hermes_verified_backup_profile_raw | trim in hermes_profile_names
          - hermes_verified_managed_profile_raw | trim in hermes_profile_names
          - >-
            hermes_telegram_state == "disabled" or
            hermes_gateway_profile == hermes_verified_managed_profile_raw | trim
        fail_msg: Protected Telegram retained profile state is invalid.
        success_msg: Protected Telegram retained profile state is valid.
      changed_when: false
      no_log: true

    - name: Derive expected runtime and managed Telegram profiles
      ansible.builtin.set_fact:
        hermes_verified_managed_profile: "{{ hermes_verified_managed_profile_raw | trim }}"
        hermes_verified_runtime_profile: >-
          {{ (hermes_verified_managed_profile_raw
              if hermes_telegram_state == 'enabled'
              else hermes_verified_backup_profile_raw) | trim }}
        hermes_verified_profile_env_path: >-
          {{ hermes_data_dir }}/profiles/{{ hermes_verified_managed_profile_raw | trim }}/.env
      no_log: true

    - name: Validate exact protected runtime profile selection
      ansible.builtin.assert:
        that:
          - >-
            hermes_verified_runtime_profile_raw ==
            'HERMES_GATEWAY_PROFILE=' ~ hermes_verified_runtime_profile ~ '\n'
        fail_msg: Protected Hermes runtime profile selection is invalid.
        success_msg: Protected Hermes runtime profile selection is valid.
      changed_when: false
      no_log: true

    - name: Inspect the managed profile environment
      ansible.builtin.stat:
        path: "{{ hermes_verified_profile_env_path }}"
        follow: false
      register: hermes_telegram_verify_profile_env_stat
      changed_when: false
      no_log: true

    - name: Validate the managed profile environment metadata
      ansible.builtin.assert:
        that:
          - hermes_telegram_verify_profile_env_stat.stat.isreg
          - not hermes_telegram_verify_profile_env_stat.stat.islnk
          - hermes_telegram_verify_profile_env_stat.stat.mode == "0600"
          - >-
            hermes_telegram_verify_profile_env_stat.stat.pw_name ==
            hermes_runtime_owner
          - >-
            hermes_telegram_verify_profile_env_stat.stat.gr_name ==
            hermes_runtime_group
        fail_msg: Managed Telegram profile environment metadata is invalid.
        success_msg: Managed Telegram profile environment metadata is valid.
      changed_when: false
      no_log: true

    - name: Read the managed profile environment for structural verification
      ansible.builtin.slurp:
        src: "{{ hermes_verified_profile_env_path }}"
      register: hermes_telegram_verify_profile_env
      changed_when: false
      no_log: true

    - name: Derive value-free managed Telegram block structure
      ansible.builtin.set_fact:
        hermes_verified_profile_env_text: >-
          {{ hermes_telegram_verify_profile_env.content | b64decode }}
        hermes_verified_telegram_block: >-
          {{ (hermes_telegram_verify_profile_env.content | b64decode)
             | regex_search('(?s)# BEGIN HERMES MANAGED TELEGRAM\n.*?# END HERMES MANAGED TELEGRAM')
             | default('', true) }}
        hermes_verified_outside_telegram_block: >-
          {{ (hermes_telegram_verify_profile_env.content | b64decode)
             | regex_replace('(?ms)^# BEGIN HERMES MANAGED TELEGRAM\n.*?\n# END HERMES MANAGED TELEGRAM(?:\n|$)', '') }}
        hermes_verified_all_telegram_keys: >-
          {{ (hermes_telegram_verify_profile_env.content | b64decode)
             | regex_findall('(?m)^(TELEGRAM_[A-Z0-9_]+)=') }}
      no_log: true

    - name: Derive value-free managed Telegram key names
      ansible.builtin.set_fact:
        hermes_verified_block_telegram_keys: >-
          {{ hermes_verified_telegram_block
             | regex_findall('(?m)^(TELEGRAM_[A-Z0-9_]+)=') }}
      no_log: true

    - name: Validate absence of unmanaged Telegram assignments
      ansible.builtin.assert:
        that:
          - >-
            hermes_verified_outside_telegram_block is not
            regex('(?m)^[ \t]*(?:export[ \t]+)?TELEGRAM_[A-Z][A-Z0-9_]*[ \t]*=')
        fail_msg: Unmanaged Telegram assignments are present outside the managed block.
        success_msg: No unmanaged Telegram assignments are present outside the managed block.
      changed_when: false
      no_log: true

    - name: Validate enabled managed Telegram block structure
      ansible.builtin.assert:
        that:
          - hermes_verified_profile_env_text.count('# BEGIN HERMES MANAGED TELEGRAM') == 1
          - hermes_verified_profile_env_text.count('# END HERMES MANAGED TELEGRAM') == 1
          - hermes_verified_block_telegram_keys == hermes_telegram_expected_keys
          - hermes_verified_all_telegram_keys == hermes_telegram_expected_keys
        fail_msg: Enabled managed Telegram block structure is invalid.
        success_msg: Enabled managed Telegram block structure is valid.
      when: hermes_telegram_state == "enabled"
      changed_when: false
      no_log: true

    - name: Validate disabled managed Telegram block absence
      ansible.builtin.assert:
        that:
          - hermes_verified_profile_env_text.count('# BEGIN HERMES MANAGED TELEGRAM') == 0
          - hermes_verified_profile_env_text.count('# END HERMES MANAGED TELEGRAM') == 0
          - hermes_verified_all_telegram_keys | length == 0
        fail_msg: Disabled managed Telegram block is still present.
        success_msg: Disabled managed Telegram block is absent.
      when: hermes_telegram_state == "disabled"
      changed_when: false
      no_log: true

    - name: Read Hermes container health
      ansible.builtin.command:
        argv:
          - docker
          - inspect
          - --format
          - "{{ '{{' }}.State.Health.Status{{ '}}' }}"
          - "{{ hermes_container_name }}"
      register: hermes_telegram_verify_health
      changed_when: false
      failed_when: hermes_telegram_verify_health.stdout != "healthy"
      no_log: true

    - name: Read bounded Hermes process arguments
      ansible.builtin.command:
        argv:
          - docker
          - top
          - "{{ hermes_container_name }}"
          - -eo
          - args
      register: hermes_telegram_verify_processes
      changed_when: false
      no_log: true

    - name: Derive value-free Hermes gateway process matches
      ansible.builtin.set_fact:
        hermes_verified_gateway_processes: >-
          {{ hermes_telegram_verify_processes.stdout_lines
             | select('search', '(^|\s)gateway\s+run(\s|$)') | list }}
        hermes_verified_profile_gateway_processes: >-
          {{ hermes_telegram_verify_processes.stdout_lines
             | select(
                 'search',
                 '(^|\s)-p\s+' ~ (hermes_verified_runtime_profile | regex_escape) ~
                 '\s+gateway\s+run(\s|$)'
               ) | list }}
      no_log: true

    - name: Validate exactly one selected-profile gateway process
      ansible.builtin.assert:
        that:
          - hermes_verified_gateway_processes | length == 1
          - hermes_verified_profile_gateway_processes | length == 1
        fail_msg: Exactly one selected-profile Hermes gateway process is required.
        success_msg: Exactly one selected-profile Hermes gateway process is active.
      changed_when: false
      no_log: true

    - name: Verify the selected runtime profile configuration
      ansible.builtin.command:
        argv: >-
          {{ hermes_cli_argv_prefix +
             ['--profile', hermes_verified_runtime_profile, 'config', 'check'] }}
      changed_when: false
      no_log: true

    - name: Read bounded Telegram polling connection markers
      ansible.builtin.command:
        argv:
          - docker
          - logs
          - --tail
          - "200"
          - "{{ hermes_container_name }}"
      register: hermes_telegram_verify_logs
      when: hermes_telegram_state == "enabled"
      changed_when: false
      no_log: true

    - name: Validate bounded Telegram polling connection markers
      ansible.builtin.assert:
        that:
          - "'[Telegram] Connected to Telegram (polling mode)' in hermes_telegram_verify_logs.stdout"
          - "'Gateway running with 1 platform(s)' in hermes_telegram_verify_logs.stdout"
        fail_msg: Telegram polling connection markers are incomplete.
        success_msg: Telegram polling connection markers are complete.
      when: hermes_telegram_state == "enabled"
      changed_when: false
      no_log: true
