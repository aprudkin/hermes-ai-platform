---
- name: Inspect the Hermes-owned Codex auth store
  ansible.builtin.stat:
    path: "{{ hermes_auth_store_path }}"
  register: hermes_auth_store
  when: hermes_model_provider == "openai-codex"

- name: Import Codex CLI subscription credentials into Hermes
  ansible.builtin.command:
    argv:
      - script
      - --quiet
      - --return
      - --command
      - "{{ hermes_model_tty_command }}"
      - /dev/null
    stdin: "\n\ny\n\n"
  when:
    - hermes_model_provider == "openai-codex"
    - not hermes_auth_store.stat.exists
  changed_when: true
  no_log: true

- name: Verify the Hermes-owned Codex auth store exists
  ansible.builtin.stat:
    path: "{{ hermes_auth_store_path }}"
  register: hermes_bootstrapped_auth_store
  when: hermes_model_provider == "openai-codex"

- name: Require a protected Hermes-owned Codex auth store
  ansible.builtin.assert:
    that:
      - hermes_bootstrapped_auth_store.stat.exists
      - hermes_bootstrapped_auth_store.stat.isreg
      - hermes_bootstrapped_auth_store.stat.mode == "0600"
      - >-
        (hermes_bootstrapped_auth_store.stat.pw_name | default('')) == hermes_runtime_owner or
        (hermes_bootstrapped_auth_store.stat.uid | string) == (hermes_runtime_owner | string)
      - >-
        (hermes_bootstrapped_auth_store.stat.gr_name | default('')) == hermes_runtime_group or
        (hermes_bootstrapped_auth_store.stat.gid | string) == (hermes_runtime_group | string)
    fail_msg: Hermes did not create a protected runtime-owned Codex auth store.
  when: hermes_model_provider == "openai-codex"
