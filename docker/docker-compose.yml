name: hermes-minimal

services:
  hermes:
    image: nousresearch/hermes-agent:v2026.8.27
    container_name: hermes
    init: false
    restart: unless-stopped
    network_mode: host
    command: ["hermes", "-p", "${HERMES_GATEWAY_PROFILE:-default}", "gateway", "run"]
    environment:
      HERMES_UID: "${HERMES_UID:-10000}"
      HERMES_GID: "${HERMES_GID:-10000}"
      API_SERVER_ENABLED: "true"
      HOME: "/opt/data"
      CODEX_HOME: "/opt/data/.codex"
      API_SERVER_HOST: "127.0.0.1"
      HERMES_TELEGRAM_DISABLE_FALLBACK_IPS: "true"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TELEGRAM_ALLOWED_USERS: "${TELEGRAM_ALLOWED_USERS:-}"
      TELEGRAM_ALLOWED_CHATS: "${TELEGRAM_ALLOWED_CHATS:-}"
      TELEGRAM_REQUIRE_MENTION: "${TELEGRAM_REQUIRE_MENTION:-}"
      TELEGRAM_EXCLUSIVE_BOT_MENTIONS: "${TELEGRAM_EXCLUSIVE_BOT_MENTIONS:-}"
      TELEGRAM_OBSERVE_UNMENTIONED_GROUP_MESSAGES: "${TELEGRAM_OBSERVE_UNMENTIONED_GROUP_MESSAGES:-}"
    volumes:
      - ${HERMES_DATA_DIR:-/opt/hermes/data}:/opt/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8642/health"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
