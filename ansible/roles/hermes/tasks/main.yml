---
- name: Refuse ordinary redeploy over retained enabled Telegram state
  ansible.builtin.include_tasks:
    file: preflight_telegram_redeploy.yml
    apply:
      tags: redeploy_preflight
  when: hermes_telegram_state | default('') != 'enabled'
  tags: redeploy_preflight

- name: Create Hermes directories with separate ownership boundaries
  ansible.builtin.include_tasks: create_directories.yml

- name: Install Compose definition
  ansible.builtin.copy:
    src: "{{ hermes_compose_source_path }}"
    dest: "{{ hermes_app_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart Hermes

- name: Create the default protected gateway runtime environment
  ansible.builtin.copy:
    content: "HERMES_GATEWAY_PROFILE=default\n"
    dest: "{{ hermes_gateway_runtime_env_path }}"
    owner: root
    group: root
    mode: "0600"
    force: false

- name: Protect the gateway runtime environment
  ansible.builtin.file:
    path: "{{ hermes_gateway_runtime_env_path }}"
    state: file
    owner: root
    group: root
    mode: "0600"

- name: Install the selected provider credential
  ansible.builtin.include_tasks: install_credentials.yml

- name: Start Hermes runtime
  ansible.builtin.command:
    argv: "{{ hermes_compose_argv_prefix + ['up', '--detach', '--remove-orphans'] }}"
  environment:
    HERMES_DATA_DIR: "{{ hermes_data_dir }}"
  register: hermes_compose_up
  changed_when: >-
    'Started' in hermes_compose_up.stderr or
    'Created' in hermes_compose_up.stderr or
    'Recreated' in hermes_compose_up.stderr

- name: Bootstrap the Hermes-owned Codex subscription session
  ansible.builtin.include_tasks: bootstrap_codex_auth.yml

- name: Initialize the pinned Hermes runtime configuration
  ansible.builtin.include_tasks: initialize_runtime.yml

- name: Wait for Hermes health check
  ansible.builtin.command:
    argv:
      - docker
      - inspect
      - --format
      - "{{ '{{' }}.State.Health.Status{{ '}}' }}"
      - "{{ hermes_container_name }}"
  register: hermes_health
  changed_when: false
  retries: 24
  delay: 5
  until: hermes_health.stdout == "healthy"

- name: Reconcile Hermes profiles and desired configuration
  ansible.builtin.include_tasks: reconcile_profiles.yml

- name: Install profile identities
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../profiles/{{ item.name }}/SOUL.md"
    dest: "{{ hermes_data_dir }}/profiles/{{ item.name }}/SOUL.md"
    owner: "{{ hermes_runtime_owner }}"
    group: "{{ hermes_runtime_group }}"
    mode: "0640"
    force: >-
      {{ (hermes_replace_profile_identities | default(false) | bool) or
         (hermes_profile_queries.results |
          selectattr('item.name', 'equalto', item.name) |
          selectattr('rc', 'equalto', 1) | list | length > 0) }}
    backup: true
  loop: "{{ hermes_profiles }}"
  notify: Restart Hermes

- name: Synchronize provider credentials into every profile
  ansible.builtin.include_tasks: install_profile_credentials.yml

- name: Apply the optional protected Telegram gateway state
  ansible.builtin.include_tasks: telegram_gateway.yml
  when: hermes_telegram_state == 'enabled'

- name: Verify every profile through the Hermes CLI
  ansible.builtin.command:
    argv: "{{ hermes_cli_argv_prefix + ['profile', 'show', item.name] }}"
  loop: "{{ hermes_profiles }}"
  changed_when: false
