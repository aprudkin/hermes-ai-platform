---
hermes_app_dir: /opt/hermes/app
hermes_data_dir: /opt/hermes/data
hermes_container_name: hermes
hermes_profiles:
  - name: manager
    description: Coordinates outcomes, work state, and verification.
  - name: devops
    description: Operates infrastructure with guarded changes and runtime proof.
  - name: coding
    description: Implements maintainable code through tested vertical slices.
  - name: research
    description: Researches current primary sources and separates evidence from inference.
hermes_profile_names: "{{ ['default'] + (hermes_profiles | map(attribute='name') | list) }}"
hermes_desired_profile_config:
  - key: model.provider
    value: "{{ hermes_model_provider }}"
  - key: model.default
    value: "{{ hermes_model }}"
  - key: tool_loop_guardrails.hard_stop_enabled
    value: "true"
