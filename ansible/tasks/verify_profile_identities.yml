---
- name: Read deployed profile identity checksums
  ansible.builtin.stat:
    path: "{{ hermes_data_dir }}/profiles/{{ item }}/SOUL.md"
    checksum_algorithm: sha256
  loop: "{{ hermes_profile_names }}"
  register: runtime_profile_identities

- name: Verify identities respect runtime ownership and explicit replacement
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isreg | default(false)
      - item.stat.size | default(0) > 0
      - >-
        not (hermes_replace_profile_identities | default(false) | bool) or
        item.stat.checksum ==
        (lookup(
          'ansible.builtin.file',
          hermes_profile_source_dir + '/' + item.item + '/SOUL.md',
          rstrip=false
        ) | hash('sha256'))
    fail_msg: >-
      Profile identity is missing, empty, not a regular file, or differs from an
      explicitly requested replacement: {{ item.item }}
  loop: "{{ runtime_profile_identities.results }}"
