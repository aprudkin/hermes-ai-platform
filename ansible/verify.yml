---
- name: Verify Hermes Minimal runtime
  hosts: hermes
  become: true
  gather_facts: false
  tasks:
    - name: Read container health
      ansible.builtin.command:
        argv:
          - docker
          - inspect
          - --format
          - "{{ '{{' }}.State.Health.Status{{ '}}' }}"
          - hermes
      register: runtime_health
      changed_when: false
      failed_when: runtime_health.stdout != "healthy"

    - name: Verify configured profiles through Hermes CLI
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - hermes
          - hermes
          - profile
          - show
          - "{{ item }}"
      loop:
        - manager
        - devops
        - coding
        - research
      changed_when: false

    - name: Read deployed profile identity checksums
      ansible.builtin.stat:
        path: "/opt/hermes/data/profiles/{{ item }}/SOUL.md"
        checksum_algorithm: sha256
      loop:
        - manager
        - devops
        - coding
        - research
      register: runtime_profile_identities

    - name: Verify deployed profile identities match repository sources
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - >-
            item.stat.checksum ==
            (lookup('ansible.builtin.file', playbook_dir + '/../profiles/' + item.item + '/SOUL.md')
            | hash('sha256'))
        fail_msg: "Profile identity does not match the reviewed source: {{ item.item }}"
      loop: "{{ runtime_profile_identities.results }}"

    - name: Verify model configuration is complete
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - hermes
          - hermes
          - --profile
          - manager
          - config
          - check
      changed_when: false

    - name: Prove one profile reaches its configured model
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - hermes
          - hermes
          - --profile
          - manager
          - -z
          - Reply with one short sentence confirming that the inference path is working.
      register: runtime_inference_probe
      changed_when: false
      failed_when: >-
        runtime_inference_probe.rc != 0 or
        runtime_inference_probe.stdout | trim | length == 0
