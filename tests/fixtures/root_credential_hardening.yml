---
- name: Exercise root credential hardening against a disposable filesystem
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  vars:
    base_root_home: "{{ lookup('ansible.builtin.env', 'HERMES_TEST_ROOT_HOME') }}"
    base_root_owner: "{{ lookup('ansible.builtin.env', 'HERMES_TEST_OWNER') }}"
    base_root_group: "{{ lookup('ansible.builtin.env', 'HERMES_TEST_GROUP') }}"
    hermes_root_ssh_public_key_source: "{{ lookup('ansible.builtin.env', 'HERMES_TEST_PUBLIC_KEY') }}"
    base_root_password_lock_enabled: false
  tasks:
    - name: Run the production root credential hardening tasks
      ansible.builtin.include_role:
        name: base
        tasks_from: root_credentials
