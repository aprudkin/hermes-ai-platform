---
- name: Create apt keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install Docker repository signing key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"
    force: false

- name: Configure Docker apt repository
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: https://download.docker.com/linux/ubuntu
    suites: "{{ ansible_distribution_release }}"
    components: stable
    architectures: "{{ ansible_architecture | replace('x86_64', 'amd64') | replace('aarch64', 'arm64') }}"
    signed_by: /etc/apt/keyrings/docker.asc
    state: present
  register: docker_repository

- name: Install Docker Engine and Compose plugin
  ansible.builtin.apt:
    name:
      - containerd.io
      - docker-buildx-plugin
      - docker-ce
      - docker-ce-cli
      - docker-compose-plugin
    state: present
    update_cache: "{{ docker_repository.changed }}"

- name: Inspect existing Docker daemon configuration
  ansible.builtin.stat:
    path: /etc/docker/daemon.json
  register: docker_daemon_file

- name: Read existing Docker daemon configuration
  ansible.builtin.slurp:
    path: /etc/docker/daemon.json
  register: docker_daemon_raw
  when: docker_daemon_file.stat.exists

- name: Parse existing Docker daemon configuration
  ansible.builtin.set_fact:
    docker_daemon_existing_config: >-
      {{
        (docker_daemon_raw.content | b64decode | from_json)
        if docker_daemon_file.stat.exists
        else {}
      }}

- name: Merge Docker log rotation defaults
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
    content: >-
      {{
        docker_daemon_existing_config
        | combine(
            {
              'log-driver': 'json-file',
              'log-opts': {'max-size': '10m', 'max-file': '3'}
            },
            recursive=true
          )
        | to_nice_json
      }}
  notify: Restart Docker

- name: Enable Docker
  ansible.builtin.service:
    name: docker
    enabled: true
    state: started
