version: '3'

tasks:
  backup:hermes:
    aliases: [b:hermes, hermes:backup]
    desc: Back up Hermes settings and personal state without images or caches
    cmds:
      - ./scripts/hermes_backup.sh

  update:hermes:
    aliases: ['hermes:update']
    desc: Back up Hermes, pin the latest stable release, push, and deploy
    cmds:
      - ./scripts/hermes_upgrade.sh
