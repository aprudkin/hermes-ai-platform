---
- name: Apply targeted Hermes Telegram gateway state
  hosts: hermes
  become: true
  gather_facts: false
  vars:
    hermes_app_dir: /opt/hermes/app
    hermes_data_dir: /opt/hermes/data
    hermes_container_name: hermes
    hermes_app_owner: root
    hermes_app_group: root
    hermes_gateway_runtime_env_path: "{{ hermes_app_dir }}/gateway.env"
    hermes_gateway_pending_reconciliation_path: >-
      {{ hermes_app_dir }}/telegram-reconciliation.pending
    hermes_compose_path: "{{ hermes_app_dir }}/docker-compose.yml"
    hermes_compose_argv_prefix:
      - docker
      - compose
      - --env-file
      - "{{ hermes_gateway_runtime_env_path }}"
      - --file
      - "{{ hermes_compose_path }}"

  pre_tasks:
    - name: Wait for the authorized Telegram target to become reachable
      ansible.builtin.wait_for_connection:
        timeout: 300
        sleep: 5

    - name: Gather minimal target facts after connection is ready
      ansible.builtin.setup:
        gather_subset:
          - "!all"
          - min

    - name: Inspect the existing Hermes installation boundary
      ansible.builtin.stat:
        path: "{{ item.path }}"
        follow: false
      loop:
        - path: "{{ hermes_compose_path }}"
          kind: file
        - path: "{{ hermes_gateway_runtime_env_path }}"
          kind: file
        - path: "{{ hermes_data_dir }}"
          kind: directory
      register: hermes_targeted_installation_paths
      changed_when: false
      no_log: true

    - name: Validate the existing Hermes installation boundary
      ansible.builtin.assert:
        that:
          - ansible_distribution == "Ubuntu"
          - ansible_distribution_version is version("24.04", ">=")
          - hermes_targeted_installation_paths.results[0].stat.isreg
          - not hermes_targeted_installation_paths.results[0].stat.islnk
          - >-
            (not hermes_targeted_installation_paths.results[1].stat.exists or
             ((hermes_targeted_installation_paths.results[1].stat.isreg |
               default(false)) and
              not (hermes_targeted_installation_paths.results[1].stat.islnk |
                   default(false)) and
              (hermes_targeted_installation_paths.results[1].stat.mode |
               default('')) == "0600"))
          - hermes_targeted_installation_paths.results[2].stat.isdir
          - not hermes_targeted_installation_paths.results[2].stat.islnk
        fail_msg: Targeted Telegram deployment requires an existing supported Hermes installation.
        success_msg: Existing Hermes installation boundary is valid.
      changed_when: false
      no_log: true

    - name: Select the read-only Compose preflight environment
      ansible.builtin.set_fact:
        hermes_targeted_preflight_env_path: >-
          {{ hermes_gateway_runtime_env_path
             if hermes_targeted_installation_paths.results[1].stat.exists
             else '/dev/null' }}
      changed_when: false

    - name: Validate the installed Compose definition without mutation
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - --env-file
          - "{{ hermes_targeted_preflight_env_path }}"
          - --file
          - "{{ hermes_compose_path }}"
          - config
          - --quiet
      environment:
        HERMES_DATA_DIR: "{{ hermes_data_dir }}"
      changed_when: false
      no_log: true

    - name: Inspect targeted Telegram reconciliation state
      ansible.builtin.stat:
        path: "{{ hermes_gateway_pending_reconciliation_path }}"
        follow: false
      register: hermes_targeted_pending_reconciliation
      changed_when: false
      no_log: true

    - name: Validate targeted Telegram reconciliation state
      ansible.builtin.set_fact:
        hermes_targeted_pending_reconciliation_valid: >-
          {{ hermes_targeted_pending_reconciliation.stat.exists and
             (hermes_targeted_pending_reconciliation.stat.isreg | default(false)) and
             not (hermes_targeted_pending_reconciliation.stat.islnk | default(false)) and
             (hermes_targeted_pending_reconciliation.stat.mode | default('')) == '0600' and
             (hermes_targeted_pending_reconciliation.stat.pw_name | default('')) == hermes_app_owner and
             (hermes_targeted_pending_reconciliation.stat.gr_name | default('')) == hermes_app_group }}
      changed_when: false
      no_log: true

    - name: Reject malformed targeted Telegram reconciliation state
      ansible.builtin.assert:
        that:
          - >-
            not hermes_targeted_pending_reconciliation.stat.exists or
            hermes_targeted_pending_reconciliation_valid
        fail_msg: Targeted Telegram reconciliation state is malformed.
        success_msg: Targeted Telegram reconciliation state is valid.
      changed_when: false
      no_log: true

    - name: Read existing Hermes container health
      ansible.builtin.command:
        argv:
          - docker
          - inspect
          - --format
          - "{{ '{{' }}.State.Health.Status{{ '}}' }}"
          - "{{ hermes_container_name }}"
      register: hermes_targeted_runtime_health
      changed_when: false
      failed_when: >-
        hermes_targeted_runtime_health.stdout != "healthy" and
        not hermes_targeted_pending_reconciliation_valid
      no_log: true

  tasks:
    - name: Apply targeted Telegram gateway state
      ansible.builtin.include_role:
        name: hermes
        tasks_from: telegram_gateway
