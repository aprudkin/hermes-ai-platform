---
- name: Initialize value-free Telegram phase reporting
  ansible.builtin.set_fact:
    hermes_telegram_current_phase: request-validation
    hermes_telegram_last_completed_phase: none
  changed_when: false

- name: Apply the protected Telegram gateway state machine
  block:
    - name: Set Telegram request-validation phase
      ansible.builtin.set_fact:
        hermes_telegram_current_phase: request-validation
      changed_when: false

    - name: Validate the protected Telegram request
      ansible.builtin.include_tasks: validate_telegram.yml

    - name: Complete Telegram request-validation phase
      ansible.builtin.set_fact:
        hermes_telegram_last_completed_phase: request-validation
      changed_when: false

    - name: Set Telegram runtime-preflight phase
      ansible.builtin.set_fact:
        hermes_telegram_current_phase: runtime-preflight
      changed_when: false

    - name: Inspect retained Telegram reconciliation state
      ansible.builtin.stat:
        path: "{{ hermes_gateway_pending_reconciliation_path }}"
        follow: false
      register: hermes_telegram_pending_reconciliation_stat
      changed_when: false
      no_log: true

    - name: Validate retained Telegram reconciliation state
      ansible.builtin.assert:
        that:
          - >-
            not hermes_telegram_pending_reconciliation_stat.stat.exists or
            (hermes_telegram_pending_reconciliation_stat.stat.isreg and
             not hermes_telegram_pending_reconciliation_stat.stat.islnk and
             hermes_telegram_pending_reconciliation_stat.stat.mode == '0600' and
             hermes_telegram_pending_reconciliation_stat.stat.pw_name == hermes_app_owner and
             hermes_telegram_pending_reconciliation_stat.stat.gr_name == hermes_app_group)
        fail_msg: Telegram reconciliation state is malformed.
        success_msg: Telegram reconciliation state is valid.
      changed_when: false
      no_log: true

    - name: Inspect protected gateway profile state files
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop:
        - "{{ hermes_gateway_profile_backup_path }}"
        - "{{ hermes_gateway_managed_profile_path }}"
      register: hermes_telegram_state_stats
      changed_when: false
      no_log: true

    - name: Validate protected gateway profile state file types and modes
      ansible.builtin.assert:
        that:
          - >-
            not item.stat.exists or
            (item.stat.isreg and not item.stat.islnk and
             item.stat.mode == '0600')
        fail_msg: Protected Telegram state is malformed.
        success_msg: Protected Telegram state file metadata is valid.
      loop: "{{ hermes_telegram_state_stats.results }}"
      changed_when: false
      no_log: true

    - name: Read retained gateway profile state
      ansible.builtin.slurp:
        src: "{{ item.item }}"
      loop: "{{ hermes_telegram_state_stats.results }}"
      when: item.stat.exists
      register: hermes_telegram_state_contents
      changed_when: false
      no_log: true

    - name: Decode retained gateway profile state
      ansible.builtin.set_fact:
        hermes_retained_pre_profile_raw: >-
          {{ (hermes_telegram_state_contents.results
              | selectattr('item.item', 'equalto', hermes_gateway_profile_backup_path)
              | selectattr('skipped', 'undefined')
              | map(attribute='content') | first | default('') | b64decode) }}
        hermes_retained_managed_profile_raw: >-
          {{ (hermes_telegram_state_contents.results
              | selectattr('item.item', 'equalto', hermes_gateway_managed_profile_path)
              | selectattr('skipped', 'undefined')
              | map(attribute='content') | first | default('') | b64decode) }}
      no_log: true

    - name: Validate retained gateway profile state contract
      ansible.builtin.assert:
        that:
          - >-
            (hermes_telegram_state_stats.results[0].stat.exists and
             hermes_telegram_state_stats.results[1].stat.exists) or
            (not hermes_telegram_state_stats.results[0].stat.exists and
             not hermes_telegram_state_stats.results[1].stat.exists) or
            (hermes_telegram_state == 'enabled' and
             hermes_telegram_pending_reconciliation_stat.stat.exists and
             (hermes_telegram_state_stats.results[0].stat.exists !=
              hermes_telegram_state_stats.results[1].stat.exists))
          - >-
            not hermes_telegram_state_stats.results[0].stat.exists or
            (hermes_retained_pre_profile_raw.endswith('\n') and
             hermes_retained_pre_profile_raw.count('\n') == 1 and
             hermes_retained_pre_profile_raw | trim is
             match('^[A-Za-z0-9][A-Za-z0-9_-]*$'))
          - >-
            not hermes_telegram_state_stats.results[1].stat.exists or
            (hermes_retained_managed_profile_raw.endswith('\n') and
             hermes_retained_managed_profile_raw.count('\n') == 1 and
             hermes_retained_managed_profile_raw | trim is
             match('^[A-Za-z0-9][A-Za-z0-9_-]*$'))
        fail_msg: Protected Telegram state is incomplete or malformed.
        success_msg: Protected Telegram state contract is valid.
      changed_when: false
      no_log: true

    - name: Derive retained gateway profile values
      ansible.builtin.set_fact:
        hermes_retained_pre_profile: "{{ hermes_retained_pre_profile_raw | trim }}"
        hermes_retained_managed_profile: "{{ hermes_retained_managed_profile_raw | trim }}"
      no_log: true

    - name: Validate retained gateway profile names
      ansible.builtin.assert:
        that:
          - >-
            not hermes_telegram_state_stats.results[0].stat.exists or
            hermes_retained_pre_profile in hermes_profile_names
          - >-
            not hermes_telegram_state_stats.results[1].stat.exists or
            hermes_retained_managed_profile in hermes_profile_names
        fail_msg: Protected Telegram state names an unavailable profile.
        success_msg: Protected Telegram state profiles are available.
      changed_when: false
      no_log: true

    - name: Derive the disabled Telegram profile from protected state
      ansible.builtin.set_fact:
        hermes_telegram_profile: "{{ hermes_retained_managed_profile }}"
        hermes_selected_profile_env_path: >-
          {{ hermes_data_dir }}/profiles/{{ hermes_retained_managed_profile }}/.env
        hermes_pre_telegram_gateway_profile: "{{ hermes_retained_pre_profile }}"
      when: hermes_telegram_state == 'disabled'
      no_log: true

    - name: Validate disabled-state protected inputs
      ansible.builtin.assert:
        that:
          - hermes_telegram_state_stats.results[0].stat.exists
          - hermes_telegram_state_stats.results[1].stat.exists
          - hermes_telegram_profile in hermes_profile_names
          - hermes_pre_telegram_gateway_profile in hermes_profile_names
        fail_msg: Protected Telegram disable state is unavailable.
        success_msg: Protected Telegram disable state is valid.
      when: hermes_telegram_state == 'disabled'
      changed_when: false
      no_log: true

    - name: Derive the protected Telegram Compose environment
      ansible.builtin.set_fact:
        hermes_telegram_compose_environment:
          HERMES_DATA_DIR: "{{ hermes_data_dir }}"
          TELEGRAM_BOT_TOKEN: >-
            {{ (hermes_telegram_values | default({})).get('TELEGRAM_BOT_TOKEN', '')
               if hermes_telegram_state == 'enabled' else '' }}
          TELEGRAM_ALLOWED_USERS: >-
            {{ (hermes_telegram_values | default({})).get('TELEGRAM_ALLOWED_USERS', '')
               if hermes_telegram_state == 'enabled' else '' }}
          TELEGRAM_ALLOWED_CHATS: >-
            {{ (hermes_telegram_values | default({})).get('TELEGRAM_ALLOWED_CHATS', '')
               if hermes_telegram_state == 'enabled' else '' }}
          TELEGRAM_REQUIRE_MENTION: >-
            {{ (hermes_telegram_values | default({})).get('TELEGRAM_REQUIRE_MENTION', '')
               if hermes_telegram_state == 'enabled' else '' }}
          TELEGRAM_EXCLUSIVE_BOT_MENTIONS: >-
            {{ (hermes_telegram_values | default({})).get('TELEGRAM_EXCLUSIVE_BOT_MENTIONS', '')
               if hermes_telegram_state == 'enabled' else '' }}
          TELEGRAM_OBSERVE_UNMENTIONED_GROUP_MESSAGES: >-
            {{ (hermes_telegram_values | default({})).get('TELEGRAM_OBSERVE_UNMENTIONED_GROUP_MESSAGES', '')
               if hermes_telegram_state == 'enabled' else '' }}
      changed_when: false
      no_log: true

    - name: Inspect the current gateway runtime environment
      ansible.builtin.stat:
        path: "{{ hermes_gateway_runtime_env_path }}"
        follow: false
      register: hermes_gateway_runtime_env_stat
      changed_when: false
      no_log: true

    - name: Validate current gateway runtime environment metadata
      ansible.builtin.assert:
        that:
          - >-
            not hermes_gateway_runtime_env_stat.stat.exists or
            (hermes_gateway_runtime_env_stat.stat.isreg and
             not hermes_gateway_runtime_env_stat.stat.islnk and
             hermes_gateway_runtime_env_stat.stat.mode == '0600')
        fail_msg: Gateway runtime environment metadata is invalid.
        success_msg: Gateway runtime environment metadata is valid.
      changed_when: false
      no_log: true

    - name: Read the current gateway runtime environment
      ansible.builtin.slurp:
        src: "{{ hermes_gateway_runtime_env_path }}"
      register: hermes_gateway_runtime_env_content
      when: hermes_gateway_runtime_env_stat.stat.exists
      changed_when: false
      no_log: true

    - name: Parse the current gateway runtime profile
      ansible.builtin.set_fact:
        hermes_gateway_runtime_env_raw: >-
          {{ (hermes_gateway_runtime_env_content.content | b64decode)
             if hermes_gateway_runtime_env_stat.stat.exists
             else 'HERMES_GATEWAY_PROFILE=default' }}
      no_log: true

    - name: Validate the current gateway runtime profile contract
      ansible.builtin.assert:
        that:
          - >-
            (not hermes_gateway_runtime_env_stat.stat.exists and
             hermes_gateway_runtime_env_raw == 'HERMES_GATEWAY_PROFILE=default') or
            (hermes_gateway_runtime_env_stat.stat.exists and
             hermes_gateway_runtime_env_raw.endswith('\n') and
             hermes_gateway_runtime_env_raw.count('\n') == 1 and
             hermes_gateway_runtime_env_raw | trim is
             match('^HERMES_GATEWAY_PROFILE=[A-Za-z0-9][A-Za-z0-9_-]*$'))
        fail_msg: Gateway runtime environment is malformed.
        success_msg: Gateway runtime environment is valid.
      changed_when: false
      no_log: true

    - name: Decode the current gateway runtime profile
      ansible.builtin.set_fact:
        hermes_current_gateway_profile: >-
          {{ hermes_gateway_runtime_env_raw
             | regex_replace('^HERMES_GATEWAY_PROFILE=', '') | trim }}
      no_log: true

    - name: Derive the pre-Telegram gateway profile for enable
      ansible.builtin.set_fact:
        hermes_pre_telegram_gateway_profile: >-
          {{ hermes_retained_pre_profile
             if hermes_telegram_state_stats.results[0].stat.exists
             else hermes_current_gateway_profile }}
      when: hermes_telegram_state == 'enabled'
      no_log: true

    - name: Inspect the selected Hermes profile directory
      ansible.builtin.stat:
        path: "{{ hermes_data_dir }}/profiles/{{ hermes_telegram_profile }}"
        follow: false
      register: hermes_selected_profile_directory_stat
      changed_when: false
      no_log: true

    - name: Validate the selected Hermes profile directory
      ansible.builtin.assert:
        that:
          - hermes_selected_profile_directory_stat.stat.exists
          - hermes_selected_profile_directory_stat.stat.isdir
          - not hermes_selected_profile_directory_stat.stat.islnk
        fail_msg: Telegram profile directory target is invalid.
        success_msg: Telegram profile directory target is valid.
      changed_when: false
      no_log: true

    - name: Inspect the Telegram-managed profile environment
      ansible.builtin.stat:
        path: "{{ hermes_selected_profile_env_path }}"
        follow: false
      register: hermes_selected_profile_env_stat
      changed_when: false
      no_log: true

    - name: Validate the Telegram-managed profile environment target
      ansible.builtin.assert:
        that:
          - >-
            not hermes_selected_profile_env_stat.stat.exists or
            (hermes_selected_profile_env_stat.stat.isreg and
             not hermes_selected_profile_env_stat.stat.islnk and
             hermes_selected_profile_env_stat.stat.mode == '0600')
        fail_msg: Telegram profile environment target is invalid.
        success_msg: Telegram profile environment target is valid.
      changed_when: false
      no_log: true

    - name: Read the Telegram-managed profile environment for state checks
      ansible.builtin.slurp:
        src: "{{ hermes_selected_profile_env_path }}"
      register: hermes_selected_profile_env_content
      when: hermes_selected_profile_env_stat.stat.exists
      changed_when: false
      no_log: true

    - name: Detect the exact managed Telegram block
      ansible.builtin.set_fact:
        hermes_selected_profile_env_raw: >-
          {{ (hermes_selected_profile_env_content.content | b64decode)
             if hermes_selected_profile_env_stat.stat.exists else '' }}
        hermes_selected_profile_has_telegram_block: >-
          {{ ('# BEGIN HERMES MANAGED TELEGRAM' in
              ((hermes_selected_profile_env_content.content | b64decode)
               if hermes_selected_profile_env_stat.stat.exists else '')) or
             ('# END HERMES MANAGED TELEGRAM' in
              ((hermes_selected_profile_env_content.content | b64decode)
               if hermes_selected_profile_env_stat.stat.exists else '')) }}
      no_log: true

    - name: Parse selected-profile Telegram block structure
      ansible.builtin.set_fact:
        hermes_selected_profile_begin_markers: >-
          {{ hermes_selected_profile_env_raw
             | regex_findall('(?m)^# BEGIN HERMES MANAGED TELEGRAM$') }}
        hermes_selected_profile_end_markers: >-
          {{ hermes_selected_profile_env_raw
             | regex_findall('(?m)^# END HERMES MANAGED TELEGRAM$') }}
        hermes_selected_profile_telegram_blocks: >-
          {{ hermes_selected_profile_env_raw
             | regex_findall('(?ms)^# BEGIN HERMES MANAGED TELEGRAM\n(.*?)\n# END HERMES MANAGED TELEGRAM(?:\n|$)') }}
        hermes_selected_profile_outside_telegram_block: >-
          {{ hermes_selected_profile_env_raw
             | regex_replace('(?ms)^# BEGIN HERMES MANAGED TELEGRAM\n.*?\n# END HERMES MANAGED TELEGRAM(?:\n|$)', '') }}
      no_log: true

    - name: Parse selected-profile managed Telegram assignments
      ansible.builtin.set_fact:
        hermes_selected_profile_telegram_lines: >-
          {{ (hermes_selected_profile_telegram_blocks | first).splitlines()
             if hermes_selected_profile_telegram_blocks | length == 1 else [] }}
      no_log: true

    - name: Validate selected-profile Telegram block structure before mutation
      ansible.builtin.assert:
        that:
          - >-
            ((hermes_selected_profile_begin_markers | length == 0) and
             (hermes_selected_profile_end_markers | length == 0) and
             (hermes_selected_profile_telegram_blocks | length == 0) and
             ('# BEGIN HERMES MANAGED TELEGRAM' not in
              hermes_selected_profile_env_raw) and
             ('# END HERMES MANAGED TELEGRAM' not in
              hermes_selected_profile_env_raw)) or
            ((hermes_selected_profile_begin_markers | length == 1) and
             (hermes_selected_profile_end_markers | length == 1) and
             (hermes_selected_profile_telegram_blocks | length == 1))
          - >-
            hermes_selected_profile_outside_telegram_block is not
            regex('(?m)^[ \t]*(?:export[ \t]+)?TELEGRAM_[A-Z][A-Z0-9_]*[ \t]*=')
          - >-
            (hermes_selected_profile_telegram_blocks | length == 0) or
            ((hermes_selected_profile_telegram_lines | length == 6) and
             (hermes_selected_profile_telegram_lines[0] is
              match('^TELEGRAM_BOT_TOKEN=.+$')) and
             (hermes_selected_profile_telegram_lines[1] is
              match('^TELEGRAM_ALLOWED_USERS=.+$')) and
             (hermes_selected_profile_telegram_lines[2] is
              match('^TELEGRAM_ALLOWED_CHATS=.+$')) and
             (hermes_selected_profile_telegram_lines[3] ==
              'TELEGRAM_REQUIRE_MENTION=true') and
             (hermes_selected_profile_telegram_lines[4] ==
              'TELEGRAM_EXCLUSIVE_BOT_MENTIONS=true') and
             (hermes_selected_profile_telegram_lines[5] ==
              'TELEGRAM_OBSERVE_UNMENTIONED_GROUP_MESSAGES=false'))
        fail_msg: Telegram profile environment structure is invalid.
        success_msg: Telegram profile environment structure is valid.
      changed_when: false
      no_log: true

    - name: Derive the exact bytes outside the managed Telegram block
      ansible.builtin.set_fact:
        hermes_telegram_profile_without_managed_block_raw: >-
          {{ hermes_selected_profile_outside_telegram_block }}
      no_log: true

    - name: Derive the exact protected Telegram block bytes
      ansible.builtin.set_fact:
        hermes_telegram_managed_block_raw: |
          # BEGIN HERMES MANAGED TELEGRAM
          {{ 'TELEGRAM_BOT_TOKEN' }}={{ hermes_telegram_values.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_USERS={{ hermes_telegram_values.TELEGRAM_ALLOWED_USERS }}
          TELEGRAM_ALLOWED_CHATS={{ hermes_telegram_values.TELEGRAM_ALLOWED_CHATS }}
          TELEGRAM_REQUIRE_MENTION=true
          TELEGRAM_EXCLUSIVE_BOT_MENTIONS=true
          TELEGRAM_OBSERVE_UNMENTIONED_GROUP_MESSAGES=false
          # END HERMES MANAGED TELEGRAM
      when: hermes_telegram_state == 'enabled'
      no_log: true

    - name: Derive the requested exact Telegram profile bytes
      ansible.builtin.set_fact:
        hermes_telegram_desired_profile_env_raw: >-
          {{ (hermes_telegram_managed_block_raw ~
              hermes_telegram_profile_without_managed_block_raw)
             if hermes_telegram_state == 'enabled'
             else hermes_telegram_profile_without_managed_block_raw }}
      no_log: true

    - name: Inspect a different previously managed profile environment
      ansible.builtin.stat:
        path: >-
          {{ hermes_data_dir }}/profiles/{{ hermes_retained_managed_profile }}/.env
        follow: false
      register: hermes_previous_managed_profile_env_stat
      when:
        - hermes_telegram_state_stats.results[1].stat.exists
        - hermes_retained_managed_profile != hermes_telegram_profile
      changed_when: false
      no_log: true

    - name: Validate a different previously managed profile environment
      ansible.builtin.assert:
        that:
          - hermes_previous_managed_profile_env_stat.stat.exists
          - hermes_previous_managed_profile_env_stat.stat.isreg
          - not hermes_previous_managed_profile_env_stat.stat.islnk
          - hermes_previous_managed_profile_env_stat.stat.mode == '0600'
        fail_msg: Previously managed Telegram profile state is unavailable.
        success_msg: Previously managed Telegram profile state is valid.
      when:
        - hermes_telegram_state_stats.results[1].stat.exists
        - hermes_retained_managed_profile != hermes_telegram_profile
      changed_when: false
      no_log: true

    - name: Read a different previously managed profile environment
      ansible.builtin.slurp:
        src: >-
          {{ hermes_data_dir }}/profiles/{{ hermes_retained_managed_profile }}/.env
      register: hermes_previous_managed_profile_env_content
      when:
        - hermes_telegram_state_stats.results[1].stat.exists
        - hermes_retained_managed_profile != hermes_telegram_profile
      changed_when: false
      no_log: true

    - name: Parse a different previously managed Telegram profile structure
      ansible.builtin.set_fact:
        hermes_previous_profile_env_raw: >-
          {{ hermes_previous_managed_profile_env_content.content | b64decode }}
        hermes_previous_profile_begin_markers: >-
          {{ (hermes_previous_managed_profile_env_content.content | b64decode)
             | regex_findall('(?m)^# BEGIN HERMES MANAGED TELEGRAM$') }}
        hermes_previous_profile_end_markers: >-
          {{ (hermes_previous_managed_profile_env_content.content | b64decode)
             | regex_findall('(?m)^# END HERMES MANAGED TELEGRAM$') }}
        hermes_previous_profile_telegram_blocks: >-
          {{ (hermes_previous_managed_profile_env_content.content | b64decode)
             | regex_findall('(?ms)^# BEGIN HERMES MANAGED TELEGRAM\n(.*?)\n# END HERMES MANAGED TELEGRAM(?:\n|$)') }}
        hermes_previous_profile_outside_telegram_block: >-
          {{ (hermes_previous_managed_profile_env_content.content | b64decode)
             | regex_replace('(?ms)^# BEGIN HERMES MANAGED TELEGRAM\n.*?\n# END HERMES MANAGED TELEGRAM(?:\n|$)', '') }}
      when:
        - hermes_telegram_state_stats.results[1].stat.exists
        - hermes_retained_managed_profile != hermes_telegram_profile
      no_log: true

    - name: Validate a different previously managed Telegram profile structure
      ansible.builtin.assert:
        that:
          - >-
            ((hermes_previous_profile_begin_markers | length == 0) and
             (hermes_previous_profile_end_markers | length == 0) and
             (hermes_previous_profile_telegram_blocks | length == 0) and
             ('# BEGIN HERMES MANAGED TELEGRAM' not in
              hermes_previous_profile_env_raw) and
             ('# END HERMES MANAGED TELEGRAM' not in
              hermes_previous_profile_env_raw)) or
            ((hermes_previous_profile_begin_markers | length == 1) and
             (hermes_previous_profile_end_markers | length == 1) and
             (hermes_previous_profile_telegram_blocks | length == 1))
          - >-
            hermes_previous_profile_outside_telegram_block is not
            regex('(?m)^[ \t]*(?:export[ \t]+)?TELEGRAM_[A-Z][A-Z0-9_]*[ \t]*=')
        fail_msg: Previously managed Telegram profile structure is invalid.
        success_msg: Previously managed Telegram profile structure is valid.
      when:
        - hermes_telegram_state_stats.results[1].stat.exists
        - hermes_retained_managed_profile != hermes_telegram_profile
      changed_when: false
      no_log: true

    - name: Detect retained Telegram state in the previously managed profile
      ansible.builtin.set_fact:
        hermes_retained_managed_profile_has_telegram_block: >-
          {{ hermes_selected_profile_has_telegram_block
             if (not hermes_telegram_state_stats.results[1].stat.exists or
                 hermes_retained_managed_profile == hermes_telegram_profile)
             else
             (('# BEGIN HERMES MANAGED TELEGRAM' in
               (hermes_previous_managed_profile_env_content.content | b64decode)) or
              ('# END HERMES MANAGED TELEGRAM' in
               (hermes_previous_managed_profile_env_content.content | b64decode))) }}
      no_log: true

    - name: Validate enable state transition preconditions
      ansible.builtin.assert:
        that:
          - >-
            (not hermes_telegram_state_stats.results[0].stat.exists and
             not hermes_telegram_state_stats.results[1].stat.exists) or
            (hermes_telegram_pending_reconciliation_stat.stat.exists and
             (not hermes_telegram_state_stats.results[1].stat.exists or
              hermes_retained_managed_profile == hermes_telegram_profile) and
             (not hermes_telegram_state_stats.results[0].stat.exists or
              hermes_current_gateway_profile == hermes_retained_pre_profile or
              hermes_current_gateway_profile == hermes_telegram_profile) and
             (hermes_current_gateway_profile == hermes_telegram_profile or
              (hermes_current_gateway_profile == hermes_pre_telegram_gateway_profile and
               (not hermes_retained_managed_profile_has_telegram_block or
                (hermes_telegram_state_stats.results[0].stat.exists and
                 hermes_telegram_state_stats.results[1].stat.exists and
                 hermes_retained_managed_profile == hermes_telegram_profile and
                 hermes_selected_profile_has_telegram_block))))) or
            (hermes_telegram_state_stats.results[0].stat.exists and
             hermes_telegram_state_stats.results[1].stat.exists and
             ((hermes_retained_managed_profile == hermes_telegram_profile and
               hermes_current_gateway_profile == hermes_telegram_profile) or
              (hermes_current_gateway_profile == hermes_retained_pre_profile and
               not hermes_retained_managed_profile_has_telegram_block)))
        fail_msg: Telegram enable state conflicts with retained state.
        success_msg: Telegram enable transition is valid.
      when: hermes_telegram_state == 'enabled'
      changed_when: false
      no_log: true

    - name: Validate disable state transition preconditions
      ansible.builtin.assert:
        that:
          - >-
            (hermes_current_gateway_profile == hermes_telegram_profile) or
            (hermes_current_gateway_profile == hermes_pre_telegram_gateway_profile and
             not hermes_selected_profile_has_telegram_block)
        fail_msg: Telegram disable state conflicts with the active runtime profile.
        success_msg: Telegram disable transition is valid.
      when: hermes_telegram_state == 'disabled'
      changed_when: false
      no_log: true

    - name: Verify the selected Hermes profile exists
      ansible.builtin.command:
        argv: "{{ hermes_cli_argv_prefix + ['profile', 'show', hermes_telegram_profile] }}"
      register: hermes_telegram_profile_show
      changed_when: false
      failed_when: >-
        hermes_telegram_profile_show.rc != 0 and
        not hermes_telegram_pending_reconciliation_stat.stat.exists
      no_log: true

    - name: Inspect Hermes container health before mutation
      ansible.builtin.command:
        argv:
          - docker
          - inspect
          - --format
          - "{{ '{{' }}.State.Health.Status{{ '}}' }}"
          - "{{ hermes_container_name }}"
      register: hermes_telegram_preflight_health
      changed_when: false
      failed_when: >-
        (hermes_telegram_preflight_health.rc != 0 or
         hermes_telegram_preflight_health.stdout != 'healthy') and
        not hermes_telegram_pending_reconciliation_stat.stat.exists
      no_log: true

    - name: Validate the current Compose definition before mutation
      ansible.builtin.command:
        argv: >-
          {{ (hermes_compose_argv_prefix
              if hermes_gateway_runtime_env_stat.stat.exists
              else ['docker', 'compose', '--env-file', '/dev/null', '--file',
                    hermes_app_dir ~ '/docker-compose.yml']) +
             ['config', '--quiet'] }}
      environment: "{{ hermes_telegram_compose_environment }}"
      changed_when: false
      no_log: true

    - name: Inspect the selected gateway evidence log before mutation
      ansible.builtin.stat:
        path: >-
          {{ hermes_data_dir }}/logs/gateways/{{ hermes_telegram_profile }}/current
        follow: false
      register: hermes_telegram_profile_log_before_stat
      when: hermes_telegram_state == 'enabled'
      changed_when: false
      no_log: true

    - name: Read the selected gateway evidence log before mutation
      ansible.builtin.slurp:
        src: >-
          {{ hermes_data_dir }}/logs/gateways/{{ hermes_telegram_profile }}/current
      register: hermes_telegram_profile_log_before
      when:
        - hermes_telegram_state == 'enabled'
        - hermes_telegram_profile_log_before_stat.stat.exists
      changed_when: false
      no_log: true

    - name: Plan the targeted Compose definition synchronization
      ansible.builtin.copy:
        src: "{{ hermes_compose_source_path }}"
        dest: "{{ hermes_app_dir }}/docker-compose.yml"
        owner: "{{ hermes_app_owner }}"
        group: "{{ hermes_app_group }}"
        mode: "0644"
      check_mode: true
      register: hermes_telegram_compose_definition_plan
      no_log: true

    - name: Determine whether protected reconciliation is required
      ansible.builtin.set_fact:
        hermes_telegram_reconciliation_required: >-
          {{ hermes_telegram_pending_reconciliation_stat.stat.exists or
             hermes_telegram_compose_definition_plan.changed or
             (hermes_selected_profile_env_raw !=
              hermes_telegram_desired_profile_env_raw) or
             (not hermes_gateway_runtime_env_stat.stat.exists) or
             (hermes_current_gateway_profile !=
              (hermes_telegram_profile
               if hermes_telegram_state == 'enabled'
               else hermes_pre_telegram_gateway_profile)) }}
      changed_when: false
      no_log: true

    - name: Complete Telegram runtime-preflight phase
      ansible.builtin.set_fact:
        hermes_telegram_last_completed_phase: runtime-preflight
      changed_when: false

    - name: Set Telegram preserve-profile-state phase
      ansible.builtin.set_fact:
        hermes_telegram_current_phase: preserve-profile-state
      changed_when: false

    - name: Retain pending Telegram reconciliation before state mutation
      ansible.builtin.copy:
        content: "pending\n"
        dest: "{{ hermes_gateway_pending_reconciliation_path }}"
        owner: "{{ hermes_app_owner }}"
        group: "{{ hermes_app_group }}"
        mode: "0600"
      when: hermes_telegram_reconciliation_required | bool
      no_log: true

    - name: Synchronize the targeted Compose definition
      ansible.builtin.copy:
        src: "{{ hermes_compose_source_path }}"
        dest: "{{ hermes_app_dir }}/docker-compose.yml"
        owner: "{{ hermes_app_owner }}"
        group: "{{ hermes_app_group }}"
        mode: "0644"
      register: hermes_telegram_compose_definition_change
      no_log: true

    - name: Preserve the pre-Telegram gateway profile once
      ansible.builtin.copy:
        content: "{{ hermes_current_gateway_profile }}\n"
        dest: "{{ hermes_gateway_profile_backup_path }}"
        owner: "{{ hermes_app_owner }}"
        group: "{{ hermes_app_group }}"
        mode: "0600"
        force: false
      register: hermes_telegram_backup_change
      when: hermes_telegram_state == 'enabled'
      no_log: true

    - name: Record the Telegram-managed gateway profile
      ansible.builtin.copy:
        content: "{{ hermes_telegram_profile }}\n"
        dest: "{{ hermes_gateway_managed_profile_path }}"
        owner: "{{ hermes_app_owner }}"
        group: "{{ hermes_app_group }}"
        mode: "0600"
      register: hermes_telegram_managed_profile_change
      when: hermes_telegram_state == 'enabled'
      no_log: true

    - name: Complete Telegram preserve-profile-state phase
      ansible.builtin.set_fact:
        hermes_telegram_last_completed_phase: preserve-profile-state
      changed_when: false

    - name: Set Telegram manage-profile-environment phase
      ansible.builtin.set_fact:
        hermes_telegram_current_phase: manage-profile-environment
      changed_when: false

    - name: Install the exact protected Telegram profile bytes
      ansible.builtin.copy:
        content: "{{ hermes_telegram_desired_profile_env_raw }}"
        dest: "{{ hermes_selected_profile_env_path }}"
        owner: "{{ hermes_runtime_owner }}"
        group: "{{ hermes_runtime_group }}"
        mode: "0600"
      register: hermes_telegram_profile_block_present_change
      when: hermes_telegram_state == 'enabled'
      no_log: true

    - name: Restore the exact profile bytes outside the managed Telegram block
      ansible.builtin.copy:
        content: "{{ hermes_telegram_desired_profile_env_raw }}"
        dest: "{{ hermes_selected_profile_env_path }}"
        owner: "{{ hermes_runtime_owner }}"
        group: "{{ hermes_runtime_group }}"
        mode: "0600"
      register: hermes_telegram_profile_block_absent_change
      when: hermes_telegram_state == 'disabled'
      no_log: true

    - name: Complete Telegram manage-profile-environment phase
      ansible.builtin.set_fact:
        hermes_telegram_last_completed_phase: manage-profile-environment
      changed_when: false

    - name: Set Telegram render-and-validate-compose phase
      ansible.builtin.set_fact:
        hermes_telegram_current_phase: render-and-validate-compose
      changed_when: false

    - name: Select the requested or restored gateway profile atomically
      ansible.builtin.copy:
        content: |
          HERMES_GATEWAY_PROFILE={{ hermes_telegram_profile
          if hermes_telegram_state == 'enabled'
          else hermes_pre_telegram_gateway_profile }}
        dest: "{{ hermes_gateway_runtime_env_path }}"
        owner: "{{ hermes_app_owner }}"
        group: "{{ hermes_app_group }}"
        mode: "0600"
      register: hermes_telegram_runtime_profile_change
      no_log: true

    - name: Validate the rendered Compose definition
      ansible.builtin.command:
        argv: "{{ hermes_compose_argv_prefix + ['config', '--quiet'] }}"
      environment: "{{ hermes_telegram_compose_environment }}"
      changed_when: false
      no_log: true

    - name: Determine whether focused Hermes recreation is required
      ansible.builtin.set_fact:
        hermes_telegram_recreation_required: >-
          {{ (hermes_telegram_reconciliation_required | bool) or
             (hermes_telegram_compose_definition_change.changed | default(false)) or
             (hermes_telegram_backup_change.changed | default(false)) or
             (hermes_telegram_managed_profile_change.changed | default(false)) or
             (hermes_telegram_profile_block_present_change.changed | default(false)) or
             (hermes_telegram_profile_block_absent_change.changed | default(false)) or
             (hermes_telegram_runtime_profile_change.changed | default(false)) }}
      changed_when: false
      no_log: true

    - name: Complete Telegram render-and-validate-compose phase
      ansible.builtin.set_fact:
        hermes_telegram_last_completed_phase: render-and-validate-compose
      changed_when: false

    - name: Set Telegram recreate-service phase
      ansible.builtin.set_fact:
        hermes_telegram_current_phase: recreate-service
      changed_when: false

    - name: Stop every prior supervised Hermes gateway
      ansible.builtin.command:
        argv: "{{ hermes_cli_argv_prefix + ['gateway', 'stop', '--all'] }}"
      when: hermes_telegram_recreation_required | bool
      changed_when: true
      no_log: true

    - name: Select the sole supervised Hermes gateway profile
      ansible.builtin.command:
        argv: >-
          {{ hermes_cli_argv_prefix +
             ['--profile',
              (hermes_telegram_profile
               if hermes_telegram_state == 'enabled'
               else hermes_pre_telegram_gateway_profile),
              'gateway', 'start'] }}
      when: hermes_telegram_recreation_required | bool
      changed_when: true
      no_log: true

    - name: Recreate only the Hermes Compose service
      ansible.builtin.command:
        argv: >-
          {{ hermes_compose_argv_prefix +
             ['up', '--detach', '--force-recreate', hermes_container_name] }}
      environment: "{{ hermes_telegram_compose_environment }}"
      when: hermes_telegram_recreation_required | bool
      changed_when: true
      no_log: true

    - name: Complete Telegram recreate-service phase
      ansible.builtin.set_fact:
        hermes_telegram_last_completed_phase: recreate-service
      changed_when: false

    - name: Set Telegram runtime-health-and-profile phase
      ansible.builtin.set_fact:
        hermes_telegram_current_phase: runtime-health-and-profile
      changed_when: false

    - name: Wait for focused Hermes service health
      ansible.builtin.command:
        argv:
          - docker
          - inspect
          - --format
          - "{{ '{{' }}.State.Health.Status{{ '}}' }}"
          - "{{ hermes_container_name }}"
      register: hermes_telegram_runtime_health
      changed_when: false
      retries: 24
      delay: "{{ hermes_telegram_health_delay | default(5) }}"
      until: hermes_telegram_runtime_health.stdout == 'healthy'
      no_log: true

    - name: Check the active Hermes profile configuration
      ansible.builtin.command:
        argv: >-
          {{ hermes_cli_argv_prefix +
             ['--profile',
              (hermes_telegram_profile
               if hermes_telegram_state == 'enabled'
               else hermes_pre_telegram_gateway_profile),
              'config', 'check'] }}
      changed_when: false
      no_log: true

    - name: Complete Telegram runtime-health-and-profile phase
      ansible.builtin.set_fact:
        hermes_telegram_last_completed_phase: runtime-health-and-profile
      changed_when: false

    - name: Set Telegram gateway-evidence phase
      ansible.builtin.set_fact:
        hermes_telegram_current_phase: gateway-evidence
      changed_when: false

    - name: Read bounded post-recreation Hermes logs
      ansible.builtin.command:
        argv:
          - docker
          - logs
          - --since
          - 2m
          - "{{ hermes_container_name }}"
      register: hermes_telegram_gateway_logs
      changed_when: false
      when:
        - hermes_telegram_state == 'enabled'
        - hermes_telegram_recreation_required | bool
      no_log: true

    - name: Inspect the selected gateway evidence log after recreation
      ansible.builtin.stat:
        path: >-
          {{ hermes_data_dir }}/logs/gateways/{{ hermes_telegram_profile }}/current
        follow: false
      register: hermes_telegram_profile_log_after_stat
      when:
        - hermes_telegram_state == 'enabled'
        - hermes_telegram_recreation_required | bool
      changed_when: false
      no_log: true

    - name: Read the selected gateway evidence log after recreation
      ansible.builtin.slurp:
        src: >-
          {{ hermes_data_dir }}/logs/gateways/{{ hermes_telegram_profile }}/current
      register: hermes_telegram_profile_log_after
      when:
        - hermes_telegram_state == 'enabled'
        - hermes_telegram_recreation_required | bool
        - hermes_telegram_profile_log_after_stat.stat.exists
      changed_when: false
      no_log: true

    - name: Derive fresh selected-profile gateway evidence
      ansible.builtin.set_fact:
        hermes_telegram_fresh_profile_gateway_logs: >-
          {% set before = (hermes_telegram_profile_log_before.content |
                           default('') | b64decode) %}
          {% set after = (hermes_telegram_profile_log_after.content |
                          default('') | b64decode) %}
          {{ after[(before | length):]
             if after[:(before | length)] == before
             else after }}
      when:
        - hermes_telegram_state == 'enabled'
        - hermes_telegram_recreation_required | bool
      changed_when: false
      no_log: true

    - name: Confirm bounded Telegram gateway fixture evidence
      ansible.builtin.assert:
        that:
          - >-
            '[Telegram] Connected to Telegram (polling mode)' in
            (hermes_telegram_gateway_logs.stdout ~
             hermes_telegram_fresh_profile_gateway_logs)
          - >-
            'Gateway running with 1 platform(s)' in
            (hermes_telegram_gateway_logs.stdout ~
             hermes_telegram_fresh_profile_gateway_logs)
        fail_msg: Telegram gateway evidence is incomplete.
        success_msg: Telegram gateway evidence is complete.
      when:
        - hermes_telegram_state == 'enabled'
        - hermes_telegram_recreation_required | bool
      changed_when: false
      no_log: true

    - name: Read the disabled profile environment for structural verification
      ansible.builtin.slurp:
        src: "{{ hermes_selected_profile_env_path }}"
      register: hermes_disabled_profile_env
      when: hermes_telegram_state == 'disabled'
      changed_when: false
      no_log: true

    - name: Confirm Telegram assignments are absent after disable
      ansible.builtin.assert:
        that:
          - >-
            (hermes_disabled_profile_env.content | b64decode) is not
            regex('(?m)^TELEGRAM_(BOT_TOKEN|ALLOWED_USERS|ALLOWED_CHATS|REQUIRE_MENTION|EXCLUSIVE_BOT_MENTIONS|OBSERVE_UNMENTIONED_GROUP_MESSAGES)=')
          - "'# BEGIN HERMES MANAGED TELEGRAM' not in (hermes_disabled_profile_env.content | b64decode)"
          - "'# END HERMES MANAGED TELEGRAM' not in (hermes_disabled_profile_env.content | b64decode)"
        fail_msg: Telegram assignments remain after disable.
        success_msg: Telegram assignments are absent after disable.
      when: hermes_telegram_state == 'disabled'
      changed_when: false
      no_log: true

    - name: Complete Telegram gateway-evidence phase
      ansible.builtin.set_fact:
        hermes_telegram_last_completed_phase: gateway-evidence
      changed_when: false

    - name: Clear reconciled Telegram runtime evidence
      ansible.builtin.file:
        path: "{{ hermes_gateway_pending_reconciliation_path }}"
        state: absent
      when: hermes_telegram_recreation_required | bool
      no_log: true

  rescue:
    - name: Report the value-free Telegram failure boundary
      ansible.builtin.fail:
        msg: >-
          Telegram phase: {{ hermes_telegram_current_phase }};
          Last completed phase: {{ hermes_telegram_last_completed_phase }}
