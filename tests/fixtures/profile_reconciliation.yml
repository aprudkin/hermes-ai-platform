---
- name: Exercise Hermes profile reconciliation
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  environment:
    PATH: "{{ lookup('ansible.builtin.env', 'PATH') }}"
    FAKE_HERMES_STATE_DIR: "{{ lookup('ansible.builtin.env', 'FAKE_HERMES_STATE_DIR') }}"
    HERMES_COMMAND_LOG: "{{ lookup('ansible.builtin.env', 'HERMES_COMMAND_LOG') }}"
    FAIL_PROFILE_SHOW: "{{ lookup('ansible.builtin.env', 'FAIL_PROFILE_SHOW') }}"
    FAIL_CONFIG_GET: "{{ lookup('ansible.builtin.env', 'FAIL_CONFIG_GET') }}"
    NEAR_MISS_PROFILE_SHOW: "{{ lookup('ansible.builtin.env', 'NEAR_MISS_PROFILE_SHOW') }}"
    NEAR_MISS_CONFIG_GET: "{{ lookup('ansible.builtin.env', 'NEAR_MISS_CONFIG_GET') }}"
  vars:
    hermes_container_name: hermes
    hermes_model_provider: openrouter
    hermes_model: test/model
    hermes_profiles:
      - name: manager
        description: Manager fixture
      - name: devops
        description: DevOps fixture
      - name: coding
        description: Coding fixture
      - name: research
        description: Research fixture
  tasks:
    - name: Run the production reconciliation task
      ansible.builtin.include_role:
        name: hermes
        tasks_from: reconcile_profiles
