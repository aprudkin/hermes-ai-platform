---
- name: Exercise default-profile API credential installation
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  vars:
    hermes_model_provider: openrouter
    hermes_data_dir: "{{ lookup('ansible.builtin.env', 'HERMES_TEST_DATA_DIR') }}"
    hermes_env_source: "{{ lookup('ansible.builtin.env', 'HERMES_TEST_PROVIDER_ENV') }}"
    hermes_runtime_owner: "{{ lookup('ansible.builtin.env', 'HERMES_TEST_OWNER') }}"
    hermes_runtime_group: "{{ lookup('ansible.builtin.env', 'HERMES_TEST_GROUP') }}"
    hermes_profile_names:
      - default
      - manager
    hermes_restart_enabled: false
  tasks:
    - name: Prepare profiles for credential synchronization
      ansible.builtin.file:
        path: "{{ hermes_data_dir }}/profiles/{{ item }}"
        state: directory
        mode: "0750"
      loop: "{{ hermes_profile_names }}"

    - name: Install the production Hermes API server credential
      ansible.builtin.include_role:
        name: hermes
        tasks_from: install_credentials

    - name: Synchronize production provider credentials into all profiles
      ansible.builtin.include_role:
        name: hermes
        tasks_from: install_profile_credentials
