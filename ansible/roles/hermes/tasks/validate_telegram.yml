---
- name: Validate the Telegram request contract
  ansible.builtin.assert:
    that:
      - hermes_telegram_state in ['enabled', 'disabled']
      - >-
        (hermes_telegram_state == 'enabled' and
         hermes_telegram_env_source | length > 0 and
         hermes_gateway_profile | length > 0) or
        (hermes_telegram_state == 'disabled' and
         hermes_telegram_env_source | length == 0 and
         hermes_gateway_profile | length == 0)
      - >-
        hermes_telegram_state == 'disabled' or
        hermes_gateway_profile is match('^[A-Za-z0-9][A-Za-z0-9_-]*$')
      - >-
        hermes_telegram_state == 'disabled' or
        hermes_gateway_profile in hermes_profile_names
    fail_msg: Telegram request validation failed.
    success_msg: Telegram request validation passed.
  changed_when: false
  no_log: true

- name: Revalidate the protected Telegram input on the controller
  ansible.builtin.command:
    argv:
      - python3
      - "{{ hermes_repo_root }}/scripts/telegram_env.py"
      - check
      - "{{ hermes_telegram_env_source }}"
  environment:
    HERMES_REPO_ROOT: "{{ hermes_repo_root }}"
  delegate_to: localhost
  become: false
  changed_when: false
  no_log: true
  when: hermes_telegram_state == "enabled"

- name: Read validated Telegram assignments into protected memory
  ansible.builtin.set_fact:
    hermes_telegram_values: >-
      {{ dict(
        lookup('ansible.builtin.file', hermes_telegram_env_source).splitlines()
        | map('split', '=', 1)
      ) }}
    hermes_telegram_profile: "{{ hermes_gateway_profile }}"
    hermes_selected_profile_env_path: >-
      {{ hermes_data_dir }}/profiles/{{ hermes_gateway_profile }}/.env
  no_log: true
  when: hermes_telegram_state == "enabled"

- name: Confirm protected Telegram assignments were parsed completely
  ansible.builtin.assert:
    that:
      - hermes_telegram_values | length == 6
      - hermes_telegram_values.TELEGRAM_BOT_TOKEN | length > 0
      - hermes_telegram_values.TELEGRAM_ALLOWED_USERS | length > 0
      - hermes_telegram_values.TELEGRAM_ALLOWED_CHATS | length > 0
      - hermes_telegram_values.TELEGRAM_REQUIRE_MENTION == 'true'
      - hermes_telegram_values.TELEGRAM_EXCLUSIVE_BOT_MENTIONS == 'true'
      - hermes_telegram_values.TELEGRAM_OBSERVE_UNMENTIONED_GROUP_MESSAGES == 'false'
    fail_msg: Protected Telegram assignments were not loaded completely.
    success_msg: Protected Telegram assignments were loaded completely.
  changed_when: false
  no_log: true
  when: hermes_telegram_state == "enabled"
