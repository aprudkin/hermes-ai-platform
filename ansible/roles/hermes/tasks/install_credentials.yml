---
- name: Inspect the private loopback API server credential
  ansible.builtin.stat:
    path: "{{ hermes_data_dir }}/.env"
  register: hermes_runtime_env_file

- name: Check for a usable private loopback API server credential
  ansible.builtin.command:
    argv:
      - grep
      - -Eq
      - ^API_SERVER_KEY=.{16,}$
      - "{{ hermes_data_dir }}/.env"
  when: hermes_runtime_env_file.stat.exists
  register: hermes_api_server_key_check
  changed_when: false
  failed_when: hermes_api_server_key_check.rc not in [0, 1]
  no_log: true

- name: Generate a private loopback API server credential
  ansible.builtin.command:
    argv:
      - openssl
      - rand
      - -hex
      - "32"
  when: >-
    not hermes_runtime_env_file.stat.exists or
    hermes_api_server_key_check.rc | default(1) == 1
  register: hermes_generated_api_server_key
  changed_when: true
  no_log: true

- name: Install the private loopback API server credential  # noqa no-handler
  ansible.builtin.lineinfile:
    path: "{{ hermes_data_dir }}/.env"
    regexp: ^API_SERVER_KEY=
    line: "API_SERVER_KEY={{ hermes_generated_api_server_key.stdout }}"
    create: true
    owner: "{{ hermes_runtime_owner }}"
    group: "{{ hermes_runtime_group }}"
    mode: "0600"
  when: hermes_generated_api_server_key is changed
  no_log: true
  notify: Restart Hermes

- name: Create protected Codex auth directory
  ansible.builtin.file:
    path: "{{ hermes_data_dir }}/.codex"
    state: directory
    owner: "{{ hermes_runtime_owner }}"
    group: "{{ hermes_runtime_group }}"
    mode: "0700"
  when: hermes_model_provider == "openai-codex"

- name: Install Codex subscription auth without logging content
  ansible.builtin.copy:
    src: "{{ hermes_codex_auth_source }}"
    dest: "{{ hermes_data_dir }}/.codex/auth.json"
    owner: "{{ hermes_runtime_owner }}"
    group: "{{ hermes_runtime_group }}"
    mode: "0600"
  when: hermes_model_provider == "openai-codex"
  no_log: true
  notify: Restart Hermes
